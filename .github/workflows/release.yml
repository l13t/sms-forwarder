name: Signed release APK

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install release tooling
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          semantic-release@25.0.9
          @semantic-release/commit-analyzer@13.0.1
          @semantic-release/release-notes-generator@14.1.0
          @semantic-release/exec@7.1.0
          @semantic-release/github@12.0.0
          conventional-changelog-conventionalcommits@10.4.1
      - name: Check commit analysis and APK preparation
        run: |
          node --test tools/release.test.mjs
          python3 tools/test_build_release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Release from Conventional Commits
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --no-install semantic-release
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.version != ''
        with:
          name: sms-forwarder-release-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-reports
          path: app/build/reports/
          if-no-files-found: ignore

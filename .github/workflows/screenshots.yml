name: README screenshots
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'tools/capture_screenshots.sh'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'tools/capture_screenshots.sh'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Capture actual UI on a disposable emulator
        run: bash tools/capture_screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: artifacts/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diagnostics
          path: |
            /tmp/sms-forwarder-emulator.log
            app/build/reports/androidTests/
  publish:
    needs: capture
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: readme-screenshots
          path: screenshots
      - name: Publish images without changing master
        env:
          SOURCE_SHA: ${{ github.sha }}
        working-directory: source
        run: |
          git fetch origin screenshots:refs/remotes/origin/screenshots || true
          if git show-ref --verify --quiet refs/remotes/origin/screenshots; then
            git switch -c screenshots --track origin/screenshots
          else
            git switch --orphan screenshots
            git rm -rf --ignore-unmatch .
          fi
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -R ../screenshots/. docs/screenshots/
          printf 'Screenshots rendered from %s\n' "$SOURCE_SHA" > docs/screenshots/SOURCE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh emulator screenshots"
            git push origin screenshots
          fi
